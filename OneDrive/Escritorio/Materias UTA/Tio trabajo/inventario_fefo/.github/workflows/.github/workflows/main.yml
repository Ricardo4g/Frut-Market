name: Integracion Continua - Frut Market

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integracion-continua:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener código
      - name: Obtener código
        uses: actions/checkout@v4

      # 2. Preparar entorno
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Compilar/verificar código
      - name: Verificar sintaxis del código
        run: |
          python -m compileall -q app.py database.py

      # 5. Ejecutar validaciones
      - name: Verificar dependencias
        run: |
          pip check

      # 6. Mostrar resultado
      - name: Proceso completado
        run: echo "Integración continua completada correctamente"