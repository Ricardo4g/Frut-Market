name: Integracion Continua FEFO

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código
      uses: actions/checkout@v4

    - name: Preparar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Verificar sintaxis con flake8
      run: |
        # Detiene el flujo si hay errores de sintaxis o nombres no definidos
        flake8 . --exclude=venv --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Ejecutar pruebas automatizadas
      run: |
        python -m pytest -v

  desplegar:
    # Despliegue continuo: solo corre en main y solo si "validar" terminó en verde
    needs: validar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://frutmarket.pythonanywhere.com
    steps:
    - name: Obtener código
      uses: actions/checkout@v4

    - name: Preparar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Publicar en PythonAnywhere y verificar /health
      env:
        PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        PA_USERNAME: FrutMarket
        PA_DOMAIN: frutmarket.pythonanywhere.com
      run: |
        if [ -z "$PA_API_TOKEN" ]; then
          echo "::notice::Sin token de API: la publicación la hace la tarea programada de PythonAnywhere (scripts/pa_autodeploy.sh), que toma este commit de main."
          exit 0
        fi
        python scripts/deploy_pythonanywhere.py
