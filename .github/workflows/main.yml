name: Integracion Continua FEFO

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código
      uses: actions/checkout@v4

    - name: Preparar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Verificar sintaxis con flake8
      run: |
        # Detiene el flujo si hay errores de sintaxis o nombres no definidos
        flake8 . --exclude=venv --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Ejecutar pruebas automatizadas
      run: |
        python -m pytest -v
